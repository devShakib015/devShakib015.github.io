<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>K M Shahriar Hossain (devShakib) — Flutter Developer &amp; CTO</title>

<!-- Canonical: consolidate this domain's search authority into the new site. -->
<link rel="canonical" href="https://devshakib.jumyn.com/">

<!-- No-JS fallback. The script below runs first and preserves the path. -->
<meta http-equiv="refresh" content="0; url=https://devshakib.jumyn.com/">

<meta name="description" content="Portfolio of K M Shahriar Hossain (devShakib) — Flutter developer and CTO. Apps, free browser tools, open-source packages and writing, now at devshakib.jumyn.com.">
<link rel="icon" type="image/png" href="/favicon.png">

<script>
(function () {
  var BASE = 'https://devshakib.jumyn.com';

  // Routes that exist on the new site. Anything else falls back to the home page
  // so a stale link never lands a visitor on a 404.
  var VALID = ['', 'work', 'apps', 'blog', 'tools', 'games', 'contact',
               'packages', 'start'];

  // Old routes -> new routes.
  var ALIAS = { projects: 'work', portfolio: 'work', home: '', about: '', index: '' };

  var path = location.pathname || '/';
  var hash = location.hash || '';

  // The old site was a hash-routed Flutter build (#/projects). The new one uses
  // real paths, so unwrap the hash into a path before matching.
  if (hash.indexOf('#/') === 0) {
    path = hash.slice(1);
    hash = '';
  }

  var seg = path.split('/')[1] || '';
  seg = seg.replace(/\.html?$/, '').toLowerCase();
  if (ALIAS.hasOwnProperty(seg)) seg = ALIAS[seg];

  var target = BASE + (VALID.indexOf(seg) !== -1 && seg ? '/' + seg : '/');

  // replace() so the old URL doesn't linger in session history.
  location.replace(target + (location.search || '') + hash);
})();
</script>

<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: grid;
    place-items: center;
    padding: 24px;
    background: #0b0a12;
    color: #e9e7f5;
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    text-align: center;
  }
  .card { max-width: 30rem; }
  .dot {
    width: 44px; height: 44px; margin: 0 auto 28px;
    border: 2px solid rgba(124, 111, 255, .25);
    border-top-color: #7c6fff;
    border-radius: 50%;
    animation: spin 900ms linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .dot { animation-duration: 4s; } }
  h1 { margin: 0 0 12px; font-size: 1.35rem; font-weight: 600; letter-spacing: -.01em; }
  p { margin: 0 0 28px; color: #a8a3c4; }
  a.cta {
    display: inline-block; padding: 12px 24px; border-radius: 999px;
    background: linear-gradient(135deg, #7c6fff, #06d6db);
    color: #0b0a12; font-weight: 600; text-decoration: none;
  }
  a.cta:hover { opacity: .9; }
  .url { display: block; margin-top: 18px; font-size: .82rem; color: #6f6a8d; }
</style>
</head>
<body>
  <main class="card">
    <div class="dot" aria-hidden="true"></div>
    <h1>This portfolio has moved</h1>
    <p>Taking you to the new site&hellip; It has the full blog, free tools, games and app store.</p>
    <a class="cta" href="https://devshakib.jumyn.com/">Continue to the new site</a>
    <span class="url">devshakib.jumyn.com</span>
  </main>
</body>
</html>
